apiVersion: v1
kind: Namespace
metadata:
  name: assistant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-assistant
  namespace: assistant
---
# Read-only access to pods and events, used to gather incident context
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-assistant-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-assistant-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-assistant-read
subjects:
  - kind: ServiceAccount
    name: ai-assistant
    namespace: assistant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  namespace: assistant
  labels:
    app.kubernetes.io/name: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-assistant
    spec:
      serviceAccountName: ai-assistant
      containers:
        - name: ai-assistant
          image: IMAGE_PLACEHOLDER   # replaced by the CI/CD pipeline
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
            - name: LOKI_URL
              value: http://loki.monitoring.svc:3100
          # LLM_BASE_URL, LLM_MODEL, LLM_API_KEY, DISCORD_WEBHOOK_URL
          # come from a secret you create by hand (never commit keys to git)
          envFrom:
            - secretRef:
                name: ai-assistant-config
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 160Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
  namespace: assistant
spec:
  selector:
    app.kubernetes.io/name: ai-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
