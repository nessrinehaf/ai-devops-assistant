apiVersion: v1
kind: Namespace
metadata:
  name: assistant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-assistant
  namespace: assistant
---
# Read-only access to pods and events, used to gather incident context
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-assistant-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-assistant-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-assistant-read
subjects:
  - kind: ServiceAccount
    name: ai-assistant
    namespace: assistant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  namespace: assistant
  labels:
    app.kubernetes.io/name: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-assistant
    spec:
      serviceAccountName: ai-assistant
      containers:
        - name: ai-assistant
          image: IMAGE_PLACEHOLDER   # replaced by the CI/CD pipeline
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
            - name: LOKI_URL
              value: http://loki.monitoring.svc:3100
            # USD per million tokens for the cost estimate (gpt-5-mini prices;
            # update these if you change model)
            - name: LLM_INPUT_PRICE_PER_M
              value: "0.25"
            - name: LLM_OUTPUT_PRICE_PER_M
              value: "2.00"
          # LLM_BASE_URL, LLM_MODEL, LLM_API_KEY, DISCORD_WEBHOOK_URL
          # come from a secret you create by hand (never commit keys to git)
          envFrom:
            - secretRef:
                name: ai-assistant-config
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 160Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
  namespace: assistant
  labels:
    app.kubernetes.io/name: ai-assistant
spec:
  selector:
    app.kubernetes.io/name: ai-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Tells Prometheus to scrape the assistant's own /metrics every 30s
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-assistant
  namespace: assistant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# Alerts about the assistant itself. Note: they go through Alertmanager to the
# assistant, so if the assistant is broken they may not reach Discord.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-assistant
  namespace: assistant
spec:
  groups:
    - name: ai-assistant
      rules:
        - alert: AIAssistantAnalysisFailing
          expr: sum(increase(ai_assistant_analyses_total{result!="success"}[15m])) >= 2
          labels:
            severity: warning
          annotations:
            summary: "AI assistant analyses are failing"
            description: "{{ $value | humanize }} analyses failed or got no LLM answer in the last 15 minutes."
        - alert: AIAssistantBudgetReached
          expr: sum(increase(ai_assistant_alerts_skipped_total{reason="hourly_budget_reached"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "AI assistant hourly analysis budget reached"
            description: "Alerts are being skipped because MAX_ANALYSES_PER_HOUR was reached."
        - alert: AIAssistantNotificationsFailing
          expr: sum(increase(ai_assistant_notifications_total{result="failed"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "AI assistant cannot post to Discord"
            description: "Discord webhook calls failed in the last 15 minutes."
