name: demo-app CI/CD

on:
  push:
    branches: [main]
    paths:
      - "demo-app/**"
      - ".github/workflows/demo-app.yaml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r demo-app/app/requirements.txt pytest
      - name: Run tests
        run: PYTHONPATH=demo-app/app pytest -q demo-app/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        id: meta
        # ghcr.io requires lowercase names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/demo-app:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: demo-app
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: VERSION=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy to K3s
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" demo-app/k8s/app.yaml \
            | ssh "ubuntu@${HOST}" \
              'kubectl --kubeconfig ~/.kube/config apply -f - &&
               kubectl --kubeconfig ~/.kube/config -n demo rollout status deploy/demo-app --timeout=180s'
