name: ai-assistant CI/CD

on:
  push:
    branches: [main]
    paths:
      - "assistant/**"
      - ".github/workflows/ai-assistant.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r assistant/app/requirements.txt pytest
      - name: Run tests
        run: PYTHONPATH=assistant/app pytest -q assistant/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/ai-assistant:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: assistant
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy to K3s
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        # Must match the SSH user that works in your demo-app workflow
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" assistant/k8s/app.yaml \
            | ssh "ubuntu@${HOST}" \
              'kubectl --kubeconfig ~/.kube/config apply -f - &&
               kubectl --kubeconfig ~/.kube/config -n assistant rollout status deploy/ai-assistant --timeout=180s'
